apiVersion: apps/v1
kind: Deployment
metadata:
  name: baatcheet-backend
  labels:
    app: baatcheet-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: baatcheet-backend
  template:
    metadata:
      labels:
        app: baatcheet-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: backend
        image: baatcheet-backend:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
